
name: Deploy to Velixir

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Velixir CLI
        run: |
          curl -fsSL https://velixir.net/install.sh | sh
          echo "$HOME/.velixir/bin" >> "$GITHUB_PATH"

      - name: Deploy
        env:
          VELIXIR_API_KEY: ${{ secrets.VELIXIR_API_KEY }}
        run: velixir deploy --app 2cb017cb-bfe6-4ab7-8fb7-d74b95251c3c
